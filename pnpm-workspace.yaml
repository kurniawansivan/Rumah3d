packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Packages that want to run install-time scripts must be allow-listed here
# (pnpm blocks arbitrary postinstall scripts by default for supply-chain safety).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
